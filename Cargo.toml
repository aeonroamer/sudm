[package]
name = "sudm"
version = "2.0.0"
edition = "2024"
description = "Async CLI that syncs local .surql schema, function and event files with a live SurrealDB"
license = "MIT"
repository = "https://github.com/aeonroamer/sudm"
readme = "README.md"
keywords = ["surrealdb", "migrations", "cli", "schema", "database"]
categories = ["command-line-utilities", "database"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
colored = "3.1.1"
dotenv = "0.15.0"
serde = "1.0.229"
surrealdb = "3.2.4"
tokio = "1.53.1"